services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipescope-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - ./sample-pipeline:/sample-pipeline:ro
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipescope-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
